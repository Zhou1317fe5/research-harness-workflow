# 审查模型契约：项目 / 宿主级科研契约，随项目走，不参与模板同步。
#
# 复制为同目录的 `review_contract.toml` 后按需填写；文件缺失或留空时使用
# `.agents/harness/review_model.py` 的内置默认值（模板默认值即该文件的默认值）。
# 参数含义、校验规则与按宿主的推导都在 `review_model.py`；本文件只承载取值。
#
# 校验在导入时 fail-closed：未知宿主、未知键、空值或不匹配的 schema_version
# 都会直接报错，不会静默用一个未获批准的模型去跑审查。
schema_version = 1

# 每个宿主获批的审查模型。键只能是 review_model.py 已知的宿主。
#   pi    —— Pi 启动的会话（scientific-reviewer 子代理与 `pi --model`）；
#            provider 前缀名。
#   codex —— `codex exec -m`，解析裸模型名。
[models]
# pi = "<provider>/<model>"
# codex = "<model>"

# 审查会话的 thinking 级别，以及哪些宿主把它写进模型 id。
# Pi 接受 `model:thinking`；codex CLI 用裸名，reasoning 另行配置。
[thinking]
# level = "high"
# suffix_hosts = ["pi"]

# 关于 provider 可用性（无需在这里配置）：
# 审查会话固定以 `--no-extensions` 启动——审查进程不执行任何扩展代码。因此获批
# 模型必须来自以下之一：
#   1. Pi 内置 provider（如 `openai-codex/*`，走 /login 或环境变量凭据）；
#   2. agent 级 `models.json` 声明的 OpenAI/Anthropic/Google 兼容端点
#      （见 Pi 文档 Choose a Model → Configure a compatible endpoint）；
#   3. 审查走 codex 后端（`--backend codex`），它用 `codex exec`，与 Pi 扩展无关。
# 若某模型只能由扩展注册，请把它声明进 `models.json`，或改用 codex 后端；
# 不要为了跑审查而在审查进程里放开扩展加载。
