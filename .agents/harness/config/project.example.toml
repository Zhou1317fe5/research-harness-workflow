# 复制为 project.toml；训练/评估参数维护在项目 .sh 脚本中。
# 这里只登记 bash 入口、阶段顺序和输出约定，与脚本一起提交。
version = 1

[[pipeline.stages]]
name = "train"
argv = ["bash", "scripts/train.sh"]
log = "train.log"
outputs = ["checkpoints/best.pt"]

[[pipeline.stages]]
name = "evaluate"
argv = ["bash", "scripts/eval.sh"]
log = "evaluate.log"
requires = ["checkpoints/best.pt"]
outputs = ["summary.json"]

# 已有单个训练评估脚本时，把上面两个阶段替换为一个阶段：
# [[pipeline.stages]]
# name = "train_eval"
# argv = ["bash", "scripts/train_eval.sh"]
# log = "train_eval.log"
# outputs = ["checkpoints/best.pt", "summary.json"]
# 并将下面的日志 artifacts 改为 train_eval.log。
# 执行器通过 RRCTL_OUTPUT_ROOT 向脚本传递本次运行的独立输出目录。

# 支持现有 JSON 或 JSONL 日志，路径相对于本次运行的 output_root。
[adapter]
progress_path = "progress.jsonl"
progress_format = "jsonl_last"
progress_count_field = "step"
first_step_min_count = 1
progress_finite_fields = ["loss"]
summary_path = "summary.json"
summary_format = "json"
summary_required_fields = ["metric"]
summary_finite_fields = ["metric"]

[[artifacts]]
path = "summary.json"
required = true

[[artifacts]]
path = "train.log"
required = false

[[artifacts]]
path = "evaluate.log"
required = false

# 可使用嵌套字段名，例如 metrics.accuracy；没有辅助指标时省略 secondary_metric。
[records]
summary_glob = "summary.json"
primary_metric = "metric"
dimensions = []
