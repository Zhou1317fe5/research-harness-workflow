[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-run-control"
version = "0.2.0"
description = "Daemonless, fail-closed control plane for reproducible remote workloads"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "remote-run-control contributors"}]
dependencies = []

[project.scripts]
rrctl = "remote_run_control.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
